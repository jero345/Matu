<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- One icon only. `public/` is served from the root, so the path is
         /favicon.svg — not ./public/... A second `alternate icon` here made
         Chromium fall back to the wordmark: it takes the last icon link it
         finds, and a webp fallback buys nothing since the browsers that would
         need one do not read webp icons either. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MATU — Protect the Wild · Argentine Yerba Mate</title>
    <meta
      name="description"
      content="Handpicked from the subtropical jungle. Agro-ecological, 100% Argentine yerba mate, regeneratively grown in the Atlantic Rainforest."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital@1&family=Poppins:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
